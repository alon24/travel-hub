name: Android app

# Builds the Travel Hub Android app (android/, the hub PWA as a Trusted Web Activity) and, on main, publishes it as the
# "android-latest" release: https://github.com/alon24/travel-hub/releases/tag/android-latest
# Optional, once: a stable signing key, so a new APK installs over the old one. Make one with
#   keytool -genkeypair -v -keystore hub.jks -alias hub -keyalg RSA -keysize 2048 -validity 10000
# and set the secrets HUB_ANDROID_KEYSTORE (base64 of hub.jks) and HUB_ANDROID_KEYSTORE_PASSWORD. Without them
# each build is signed with a new throwaway key, and updating means uninstalling the old app first.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.HUB_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.HUB_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/hub.jks"
            { echo "HUB_KEYSTORE_FILE=$RUNNER_TEMP/hub.jks"; echo "HUB_KEYSTORE_PASSWORD=$PASSWORD"; echo "HUB_KEY_ALIAS=hub"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No HUB_ANDROID_KEYSTORE secret: this APK is signed with a throwaway key, so it won't install over an earlier one"
          fi
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk travel-hub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: travel-hub-apk
          path: travel-hub.apk
      - name: Publish the APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Travel Hub for Android" \
            --notes "The newest Travel Hub Android app. Download travel-hub.apk on the phone and open it to install."
          gh release upload android-latest travel-hub.apk --clobber
