name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public config: Settings → Secrets and variables → Actions → Variables. Empty = AI features hidden.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          # Google sign-in gate (same OAuth client as MyMaps AI) and who may use the hub (sha256 hashes)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
      # Without these the hub would ship with no sign-in gate, or open to any Google account
      - name: Check the sign-in gate is in the bundle
        run: |
          test -n "${{ vars.VITE_GOOGLE_CLIENT_ID }}" || { echo "::error::VITE_GOOGLE_CLIENT_ID variable is not set"; exit 1; }
          test -n "${{ vars.VITE_ALLOWED_EMAILS }}" || { echo "::error::VITE_ALLOWED_EMAILS variable is not set"; exit 1; }
          grep -rq "${{ vars.VITE_GOOGLE_CLIENT_ID }}" dist/assets || { echo "::error::Google client id missing from the build"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
