plugins {
    id "com.android.application"
}

// Release signing comes from the environment (CI decodes the HUB_ANDROID_KEYSTORE secret); without it the APK is
// signed with a throwaway debug key, and an update then has to be installed over an uninstall.
def keystore = System.getenv("HUB_KEYSTORE_FILE")

android {
    namespace "io.github.alon24.travelhub"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.alon24.travelhub"
        minSdk 26
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "0.1.0"
    }
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("HUB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HUB_KEY_ALIAS")
                keyPassword System.getenv("HUB_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
